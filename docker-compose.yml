version: "3.9"

services:
  # ──────────────────────────────────────────────────────────
  # PostgreSQL 16 with pgvector extension
  # Used by: backend/database.py (AlertEvent, CameraZone tables)
  # ──────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ibvap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ibvap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ibvap"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
